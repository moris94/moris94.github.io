name: Build, validate and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly external link check (App Store and policy pages)
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # No third-party dependencies: build.py and validate.py use the standard library only.
      - name: Build static site
        run: python3 site/build.py --base-url https://moris94.github.io --out dist
      - name: Validate HTML, links, canonical, hreflang, JSON-LD, sitemap and robots
        run: python3 site/validate.py --dist dist --base-url https://moris94.github.io
      - name: Check external links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 site/validate.py --dist dist --base-url https://moris94.github.io --external
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
